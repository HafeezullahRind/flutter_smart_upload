name: flutter_smart_upload
description: Backend-agnostic, memory-efficient file uploads for Flutter — chunked, resumable, retrying, with pause/resume/cancel, a concurrency-limited queue and pluggable adapters.
version: 0.1.1
repository: https://github.com/HafeezullahRind/flutter_smart_upload
issue_tracker: https://github.com/HafeezullahRind/flutter_smart_upload/issues
documentation: https://github.com/HafeezullahRind/flutter_smart_upload#readme

environment:
  sdk: ^3.6.0

dependencies:
  crypto: ^3.0.3
  image: ^4.3.0
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

screenshots:
  - description: Two files uploading side by side with percentage, speed and ETA; a third waiting in the queue.
    path: doc/screenshots/01-queue.png
  - description: All transfers paused mid-upload; acknowledged chunks are kept.
    path: doc/screenshots/02-paused.png
  - description: An upload parked while the device is offline, ready to continue where it stopped.
    path: doc/screenshots/04-offline.png
  - description: Retrying a failed chunk with exponential backoff against a deliberately flaky server.
    path: doc/screenshots/05-retry.png
  - description: Completed uploads showing the URLs returned by the adapter.
    path: doc/screenshots/03-completed.png

topics:
  - upload
  - files
  - chunked
  - resumable
  - compression
