name: flutter_smart_upload_example
description: Demonstrates flutter_smart_upload — chunked, resumable, queued uploads with live progress.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.0
  flutter_smart_upload:
    path: ../
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
